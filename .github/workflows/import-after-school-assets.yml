name: Complete one-time After School source import
on:
  push:
    branches: [import/after-school-six-cities]
    paths: [.after-school-import/**]
permissions:
  contents: write
jobs:
  assemble-original-programs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact original PDF files and remove temporary importer
        run: python3 .after-school-import/assemble.py
      - name: Commit original programs to the import branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sites .after-school-import .github/workflows/import-after-school-assets.yml
          git commit -m 'Complete After School import with original PDF programs'
          git push origin HEAD:import/after-school-six-cities
